<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="electroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D19" />
      <stop offset="100%" stop-color="#0E1E3A" />
    </linearGradient>
    <linearGradient id="electroCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#electroBg)" stroke="#00F0FF" stroke-width="2.5"/>

  <!-- Circuit nodes -->
  <circle cx="20" cy="25" r="4" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="80" cy="25" r="4" fill="#0EA5E9"/>
  <circle cx="25" cy="78" r="4" fill="#10B981"/>
  <circle cx="75" cy="78" r="4" fill="#00F0FF"/>

  <path d="M 20 25 L 35 25 L 45 35" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 80 25 L 65 25 L 55 35" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
  <path d="M 25 78 L 40 78 L 48 68" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

  <!-- Stylized Hand Pinching Lightning / Cable -->
  <path d="M 38 65 C 38 65, 34 52, 40 45 C 43 41, 48 40, 50 45 L 52 35 C 53 31, 58 31, 59 35 L 60 45 C 62 43, 67 43, 68 47 L 69 55 C 69 66, 60 72, 50 72 C 43 72, 38 68, 38 65 Z" fill="#1E293B" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Lightning Bolt between pinch -->
  <path d="M 47 22 L 44 32 L 53 32 L 49 44" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
